<!DOCTYPE html>
<!-- Open this file in a browser, right-click each canvas, save as icon16.png / icon48.png / icon128.png -->
<html>
<body style="background:#fff;display:flex;gap:16px;align-items:flex-end;padding:24px;font-family:sans-serif">
<script>
  function makeIcon(size) {
    const c = document.createElement("canvas");
    c.width = size; c.height = size;
    c.title = `icon${size}.png`;
    const ctx = c.getContext("2d");
    // Background
    ctx.fillStyle = "#5b5bd6";
    ctx.beginPath();
    ctx.roundRect(0, 0, size, size, size * 0.2);
    ctx.fill();
    // Letter "J"
    ctx.fillStyle = "#fff";
    ctx.font = `bold ${size * 0.6}px sans-serif`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("J", size / 2, size / 2);
    document.body.appendChild(c);
    const label = document.createElement("div");
    label.textContent = `${size}×${size} — right-click → Save as icon${size}.png`;
    label.style.fontSize = "11px";
    label.style.color = "#666";
    const wrap = document.createElement("div");
    wrap.style.display = "flex"; wrap.style.flexDirection = "column"; wrap.style.alignItems = "center"; wrap.style.gap = "6px";
    wrap.appendChild(c); wrap.appendChild(label);
    document.body.appendChild(wrap);
  }
  [16, 48, 128].forEach(makeIcon);
</script>
</body>
</html>
