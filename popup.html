<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Job Notifier</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>

  <!-- Persistent header -->
  <div class="popup-header">
    <span class="popup-brand">Job Notifier</span>
    <div class="header-right">
      <label class="toggle-wrap" title="Auto-detect job applications">
        <span class="toggle-label">Auto-detect</span>
        <span class="toggle">
          <input type="checkbox" id="auto-toggle">
          <span class="toggle-slider"></span>
        </span>
      </label>
      <button id="settings-btn" class="icon-btn" title="Settings" aria-label="Settings">⚙</button>
    </div>
  </div>

  <!-- Loading state -->
  <div id="loading">
    <div class="spinner"></div>
    <p class="loading-text">Analyzing job posting…</p>
  </div>

  <!-- Input state: detected posting (pre-filled) or paste your own -->
  <div id="manual-fallback" hidden>
    <p id="fallback-message" class="fallback-message"></p>
    <textarea
      id="manual-input"
      class="manual-input"
      rows="8"
      placeholder="Paste the job posting text here…"
    ></textarea>
    <p id="manual-error" class="manual-error"></p>
    <button id="manual-analyze-btn" class="analyze-btn">Draft a message</button>
  </div>

  <!-- Results state -->
  <div id="results" hidden>
    <div id="job-card" class="job-card"></div>

    <div class="share-label">Share with</div>
    <div id="group-hint" class="group-hint"></div>
    <div id="group-chips" class="group-chips" role="radiogroup" aria-label="Group"></div>
    <ul id="member-list" class="member-list"></ul>

    <label class="share-label" for="message-box">Message</label>
    <textarea id="message-box" class="message-box" rows="4"></textarea>

    <div id="recruiter" class="recruiter">
      <label class="recruiter-label" for="recruiter-input">Do you have a recruiter contact for this position?</label>
      <p class="recruiter-sub">Optional. Paste their LinkedIn and it's added to the email and to Copy.</p>
      <input id="recruiter-input" class="recruiter-input" type="url" inputmode="url" autocomplete="off"
             placeholder="https://www.linkedin.com/in/…">
      <p id="recruiter-status" class="recruiter-status" aria-live="polite"></p>
    </div>

    <div class="bulk-actions">
      <button id="email-btn" class="send-all-btn">Email group</button>
      <button id="copy-btn" class="copy-btn">Copy</button>
    </div>
    <p class="bulk-hint">Opens one email with your friends in Bcc, so they don't see each other's addresses.</p>
  </div>

  <!-- Error state -->
  <div id="error-state" hidden>
    <div class="error-icon">⚠</div>
    <p id="error-message" class="error-message"></p>
    <button id="error-settings-btn" class="analyze-btn" hidden>Open settings</button>
  </div>

  <script src="lib/core.js"></script>
  <script src="popup.js"></script>
</body>
</html>
