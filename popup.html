<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Job Notifier</title>
  <link rel="stylesheet" href="ui.css" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="popup-header">
    <h1 class="wordmark">Job Notifier</h1>
    <div class="header-actions">
      <label class="switch">
        <span>Auto-detect</span>
        <input type="checkbox" role="switch" id="auto-toggle" />
        <span class="track" aria-hidden="true"></span>
      </label>
      <button type="button" id="settings-btn" class="btn-text">Settings</button>
    </div>
  </header>
  <p id="auto-status" class="small muted status-line" role="status"></p>

  <section id="auto-panel" class="auto-panel stack" aria-labelledby="auto-heading" hidden>
    <h2 id="auto-heading" tabindex="-1">Turn on auto-detect?</h2>
    <p>Job Notifier will read the visible text of pages you open to spot job postings and application confirmations. Nothing is sent to Claude until you click Find friends. Chrome will ask you to allow access to all sites.</p>
    <div class="actions">
      <button type="button" id="auto-continue" class="btn btn-primary">Continue</button>
      <button type="button" id="auto-cancel" class="btn btn-secondary">Cancel</button>
    </div>
  </section>

  <main id="panel"></main>

  <footer id="popup-footer" class="popup-footer" hidden>
    <span class="small muted">Unlocked for this session</span>
    <button type="button" id="popup-lock-btn" class="btn-text">Lock now</button>
  </footer>

  <script src="lib/core.js"></script>
  <script src="ui.js"></script>
  <script src="popup.js"></script>
</body>
</html>
